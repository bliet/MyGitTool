name: Release

# A pushed version tag (e.g. v0.2.0) builds the packages and publishes them
# as a GitHub release. Running the workflow by hand only builds them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The packages are named after the version in Cargo.toml, so a tag that
  # doesn't match it would publish misnamed packages.
  check-version:
    name: check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkgid=$(cargo pkgid -p app)
          version=${pkgid##*[#@]}
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version $version. Bump the version before tagging."
            exit 1
          fi

  package:
    name: package (${{ matrix.os }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu, so the binary runs on older glibc too.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        shell: bash
        run: scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  arch:
    name: package (Arch Linux)
    needs: check-version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust \
            webkit2gtk-4.1 gtk3 xdotool openssl libsoup3
          # makepkg refuses to run as root.
          useradd --create-home builder
      - uses: actions/checkout@v7
      - name: Build the package
        run: |
          chown -R builder .
          su builder -c scripts/package-arch.sh
      - uses: actions/upload-artifact@v7
        with:
          name: package-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # Alpha and beta versions are published as pre-releases.
          prerelease: ${{ endsWith(github.ref_name, '-alpha') || endsWith(github.ref_name, '-beta') }}
